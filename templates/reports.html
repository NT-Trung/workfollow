{% extends 'base.html' %}{% block title %}Báo cáo{% endblock %}{% block subtitle %}Hiệu suất theo tuần và tháng{% endblock %}{% block content %}
<section class="cards"><div class="card blue"><span>Tổng việc</span><b>{{stats.total}}</b></div><div class="card green"><span>Hoàn thành</span><b>{{stats.done}}</b></div><div class="card purple"><span>Tỷ lệ</span><b>{{stats.rate}}%</b></div></section><section class="grid two"><div class="panel"><h3>Hiệu suất tuần</h3><canvas id="barWeek" data-labels='{{week_labels|tojson}}' data-values='{{week_rates|tojson}}'></canvas></div><div class="panel"><h3>Hiệu suất tháng</h3><canvas id="barMonth" data-labels='{{month_labels|tojson}}' data-values='{{month_rates|tojson}}'></canvas></div></section>
{% endblock %}
